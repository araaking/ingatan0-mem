name: Release

# Publishes to PyPI when a tag such as v0.1.0 is pushed.
#
# This only works after the project owner has configured a PyPI trusted publisher
# (PyPI project "ingatan" -> Publishing -> add a GitHub publisher: this repository,
# workflow file "release.yml", environment "pypi"). Until then the publish job fails
# at the token exchange; no API token is stored in this repository.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build sdist and wheel
        run: uv build --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
